<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متجر Rawy</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1C2742">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a denim shop. Indigo ink, washed-denim tints and one tan accent borrowed from
   jeans stitching and kraft hang tags. Product tiles stay in close fabric tones; the price is a hang tag.
   The order sits at the end as a receipt. Single light theme on purpose: the palette is the brand. */
:root {
  --paper: #F1EFEA;
  --card: #FFFFFF;
  --ink: #1C2742;
  --muted: #566079;
  --line: #C9CFDD;
  --denim: #34508F;
  --wash: #D3DEEF;
  --tan: #D7AE78;
  --alert: #9B2C1F;
  --display: 'Reem Kufi', 'IBM Plex Sans Arabic', Tahoma, sans-serif;
  --body: 'IBM Plex Sans Arabic', Tahoma, 'Segoe UI', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background-color: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6; }
.bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200' fill='none' stroke='%2334508F' stroke-opacity='.13' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><path d='M22 20h7q5 6 10 0h7l14 10-6 10-6-4v28H22V36l-6 4-6-10z'/><path d='M140 34q0-7 7-7t7 7q0 5-7 7l-24 15h48l-24-15'/><circle cx='52' cy='140' r='11'/><circle cx='48.5' cy='136.5' r='1.4'/><circle cx='55.5' cy='136.5' r='1.4'/><circle cx='48.5' cy='143.5' r='1.4'/><circle cx='55.5' cy='143.5' r='1.4'/><path d='M118 150l44-18' stroke-dasharray='6 6'/><path d='M164 131l10-4'/><path d='M96 92l8 8M104 92l-8 8'/></svg>"), repeating-linear-gradient(135deg, rgba(52, 80, 143, .05) 0 1px, transparent 1px 8px); background-size: 200px 200px, auto; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
body { padding-bottom: var(--sab, env(safe-area-inset-bottom, 0px)); }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--denim); outline-offset: 2px; }

header.top { background: var(--ink) repeating-linear-gradient(135deg, rgba(255, 255, 255, .055) 0 2px, transparent 2px 7px); color: #FFFFFF; padding: calc(22px + var(--sat, env(safe-area-inset-top, 0px))) 0 10px; }
.brand {
  display: inline-flex; align-items: center; gap: 16px; margin: 0; padding: 4px 20px 8px;
  border: 2px dashed var(--tan); border-radius: 14px;
  font-family: var(--display); font-weight: 700; font-size: clamp(2.2rem, 9.5vw, 3.4rem); line-height: 1.25;
}
.brand .sep { align-self: stretch; width: 2px; margin: 8px 0 4px; background: repeating-linear-gradient(to bottom, var(--tan) 0 6px, transparent 6px 12px); }
.brand .lat { letter-spacing: .03em; }
.tagline { margin: 12px 0 14px; color: #D5DAE8; font-size: 1rem; }
.stripe { border-top: 2px dashed var(--tan); }

.notice { margin: 16px 0 0; padding: 10px 14px; border: 2px dashed var(--ink); border-radius: 12px; background: #F6EAD7; font-size: .9rem; }
.notice[hidden] { display: none; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 18px 0 2px; }
.filters[hidden] { display: none; }
.chip { border: 2px solid var(--ink); background: var(--card); border-radius: 999px; padding: 5px 16px; cursor: pointer; font-size: .92rem; font-weight: 500; min-height: 40px; }
.chip[aria-pressed="true"] { background: var(--ink); color: #FFFFFF; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 16px; padding: 16px 0 32px; }
@media (min-width: 720px) { .grid { grid-template-columns: repeat(auto-fill, minmax(224px, 1fr)); gap: 22px; } }

.card { background: var(--card); border: 2px solid var(--ink); border-radius: 16px; box-shadow: 4px 4px 0 var(--ink); display: flex; flex-direction: column; overflow: hidden; }
@media (hover: hover) and (prefers-reduced-motion: no-preference) {
  .card { transition: transform .15s ease, box-shadow .15s ease; }
  .card:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--ink); }
  .sticker { transition: transform .15s ease; }
  .card:hover .sticker { transform: rotate(3deg) scale(1.05); }
}
.pic { aspect-ratio: 1 / 1; position: relative; border-bottom: 2px solid var(--ink); overflow: hidden; }
.track { display: flex; width: 100%; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.track::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 100%; height: 100%; scroll-snap-align: center; display: grid; place-items: center; }
.pic svg { width: 76%; height: 76%; display: block; }
.pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.dots { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; padding: 4px 8px; background: rgba(255, 255, 255, .85); border: 1.5px solid var(--ink); border-radius: 999px; }
.dot { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 50%; background: var(--line); cursor: pointer; }
.dot[aria-current="true"] { background: var(--ink); }
.nav { position: absolute; top: 50%; margin-top: -17px; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--ink); background: var(--card); cursor: pointer; font-weight: 700; line-height: 1; display: none; place-items: center; padding: 0; }
.nav.prev { inset-inline-start: 8px; } .nav.next { inset-inline-end: 8px; }
@media (hover: hover) { .pic:hover .nav, .nav:focus-visible { display: grid; } }
.card.is-out .pic img, .card.is-out .pic svg { opacity: .4; filter: grayscale(1); }
.sticker {
  position: absolute; inset-block-end: 10px; inset-inline-start: 10px; background: var(--tan); border: 2px solid var(--ink);
  border-radius: 8px; padding: 1px 12px 3px; padding-inline-start: 26px; font-family: var(--display); font-weight: 700; font-size: 1.15rem; line-height: 1.5;
  transform: rotate(-4deg); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.sticker::before { content: ""; position: absolute; inset-inline-start: 8px; top: 50%; width: 8px; height: 8px; margin-top: -6px; border: 2px solid var(--ink); border-radius: 50%; background: var(--card); }
.sticker small { font-family: var(--body); font-size: .7rem; font-weight: 700; margin-inline-start: 4px; }
.card.is-out .sticker { background: var(--card); }
.info { padding: 12px; display: flex; flex-direction: column; gap: 9px; flex: 1; }
.name { margin: 0; font-size: 1rem; font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; }
.pill { align-self: flex-start; font-size: .76rem; font-weight: 700; padding: 1px 10px; border-radius: 999px; border: 2px solid var(--ink); }
.pill.ok { background: var(--wash); } .pill.low { background: var(--tan); } .pill.out { background: var(--ink); color: #FFFFFF; }
.sizes { display: flex; flex-wrap: wrap; gap: 6px; }
.size { min-width: 40px; min-height: 38px; padding: 2px 8px; border: 2px solid var(--ink); background: var(--card); border-radius: 9px; cursor: pointer; font-size: .86rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.size[aria-pressed="true"] { background: var(--ink); color: #FFFFFF; }
.size:disabled { cursor: not-allowed; opacity: .4; text-decoration: line-through; border-style: dashed; }
.add { margin-top: auto; border: 2px solid var(--ink); border-radius: 11px; background: var(--denim); color: #FFFFFF; padding: 9px 12px; cursor: pointer; font-weight: 700; min-height: 46px; }
.add:disabled { cursor: not-allowed; background: var(--paper); color: var(--muted); border-color: var(--line); }
.hint { margin: 0; font-size: .8rem; font-weight: 500; color: var(--alert); min-height: 1.2em; }
.empty { color: var(--muted); margin: 0 0 14px; }

.order { background: var(--card); border: 2px solid var(--ink); border-radius: 16px; box-shadow: 4px 4px 0 var(--ink); overflow: hidden; margin-bottom: 30px; }
.order h2 { font-family: var(--display); font-weight: 700; font-size: 1.6rem; line-height: 1.3; margin: 0; padding: 8px 16px 10px; background: var(--tan); border-bottom: 2px solid var(--ink); }
.order h2.alt { background: var(--wash); }
.order-body { padding: 16px; }
.done p { white-space: pre-line; }
.lines { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-direction: column; }
.line { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 12px 0; border-bottom: 2px dashed var(--line); align-items: center; }
.line .what { font-weight: 700; overflow-wrap: anywhere; }
.line .what span { display: block; font-weight: 400; color: var(--muted); font-size: .86rem; }
.line .sum { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
.stepper { display: inline-flex; align-items: center; gap: 8px; }
.stepper button { width: 38px; height: 38px; border-radius: 10px; border: 2px solid var(--ink); background: var(--card); cursor: pointer; font-size: 1.15rem; font-weight: 700; line-height: 1; }
.stepper button:disabled { opacity: .35; cursor: not-allowed; }
.stepper output { min-width: 1.6em; text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; }
.remove { border: 0; background: none; color: var(--alert); cursor: pointer; padding: 6px 0; font-size: .86rem; justify-self: end; text-decoration: underline; }
.sumrow { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 4px 0; }
.sumrow[hidden] { display: none; }
.sumrow.ship { color: var(--muted); font-size: .92rem; }
.sumrow.total { font-weight: 700; padding-bottom: 14px; }
.sumrow.total b { font-family: var(--display); font-weight: 700; font-size: 1.6rem; font-variant-numeric: tabular-nums; }

.fields { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 720px) { .fields { grid-template-columns: 1fr 1fr; } .fields .wide { grid-column: 1 / -1; } }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: .86rem; font-weight: 500; }
.field input, .field textarea, .field select { border: 2px solid var(--ink); background: var(--paper); border-radius: 10px; padding: 9px 12px; width: 100%; min-height: 46px; }
.field textarea { min-height: 72px; resize: vertical; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; min-height: 50px; padding: 9px 20px; border: 2px solid var(--ink); border-radius: 11px; font-weight: 700; cursor: pointer; color: var(--ink); background: var(--card); }
.btn.go { background: var(--ink); color: #FFFFFF; flex: 1 1 220px; }
.msg { margin: 10px 0 0; font-size: .9rem; font-weight: 500; color: var(--alert); min-height: 1.4em; }
.fine { margin: 8px 0 0; font-size: .84rem; color: var(--muted); }
.linkbtn { border: 0; background: none; padding: 8px 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: .84rem; }
.linkbtn[hidden], .btn[hidden] { display: none; }
.done { margin-top: 14px; border: 2px solid var(--ink); border-radius: 12px; background: var(--wash); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.done[hidden] { display: none; }
.done h3 { font-family: var(--display); font-weight: 700; font-size: 1.3rem; line-height: 1.2; margin: 0; }
.done p { margin: 0; }

dialog { border: 2px solid var(--ink); border-radius: 16px; box-shadow: 6px 6px 0 var(--ink); padding: 0; width: min(92vw, 380px); background: var(--card); color: var(--ink); }
dialog::backdrop { background: rgba(27, 19, 64, .6); }
dialog h3 { font-family: var(--display); font-weight: 700; font-size: 1.4rem; line-height: 1.3; margin: 0; padding: 8px 16px 10px; background: var(--wash); border-bottom: 2px solid var(--ink); }
dialog p { margin: 0; padding: 18px 16px 4px; font-size: 1.05rem; }
dialog .actions { padding: 14px 16px 18px; margin: 0; }
dialog .btn { flex: 1 1 120px; }

.bar { position: sticky; bottom: 0; background: var(--ink); color: #FFFFFF; border: 0; border-top: 2px dashed var(--tan); width: 100%; padding: 12px 16px calc(12px + var(--sab, env(safe-area-inset-bottom, 0px))); cursor: pointer; display: flex; justify-content: space-between; gap: 12px; align-items: center; font-weight: 700; }
.bar[hidden] { display: none; }
.bar b { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

/* شاشة التحميل: بتفضل لحد ما المنتجات وصورها الأولى تجهز */
#loader { position: fixed; inset: 0; z-index: 9999; background: var(--ink) repeating-linear-gradient(135deg, rgba(255,255,255,.055) 0 2px, transparent 2px 7px); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; transition: opacity .45s ease, visibility .45s; }
#loader.gone { opacity: 0; visibility: hidden; pointer-events: none; }
#loader .lockup { font-family: var(--display); font-size: 2.6rem; font-weight: 700; letter-spacing: .02em; display: flex; gap: 14px; align-items: center; }
#loader .lockup i { width: 0; height: 1.6em; border-inline-start: 2px dashed #D2A663; }
#loader .ring { width: 46px; height: 46px; border-radius: 50%; border: 3px dashed rgba(255,255,255,.25); border-top-color: #D2A663; animation: lspin 1s linear infinite; }
#loader p { margin: 0; font-size: .95rem; opacity: .8; }
@keyframes lspin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { #loader .ring { animation-duration: 3s; } #loader { transition: none; } }
</style>
</head>
<body>
<div id="loader" role="status" aria-live="polite"><div class="lockup"><span>راوي</span><i></i><span dir="ltr">Rawy</span></div><div class="ring"></div><p>بنجهّز المنتجات...</p></div>
<div class="bg" id="bg" aria-hidden="true"></div>

<header class="top">
  <div class="wrap">
    <h1 class="brand"><span id="brand-ar"></span><span class="sep" aria-hidden="true"></span><span class="lat" id="brand" dir="ltr"></span></h1>
    <p class="tagline" id="tagline"></p>
  </div>
  <div class="stripe" aria-hidden="true"></div>
</header>

<main class="wrap">
  <p class="notice" id="notice" hidden></p>
  <div class="filters" id="filters" role="group" aria-label="الأقسام"></div>
  <section class="grid" id="grid" aria-label="المنتجات"></section>

  <section class="order" id="order" aria-labelledby="order-title">
    <h2 id="order-title">الأوردر</h2>
    <div class="order-body">
      <p class="empty" id="empty">السلة فاضية. اختار المقاس ودوس "أضف للسلة".</p>
      <ul class="lines" id="lines"></ul>
      <div class="sumrow ship" id="ship-row" hidden><span>الشحن</span><span id="ship"></span></div>
      <div class="sumrow total" id="total-row" hidden><span>الإجمالي</span><b id="total"></b></div>

      <form id="form" novalidate>
        <div class="fields">
          <div class="field"><label for="cust-name">الاسم</label><input id="cust-name" autocomplete="name" required></div>
          <div class="field"><label for="cust-phone">رقم الموبايل</label><input id="cust-phone" inputmode="tel" autocomplete="tel" dir="ltr" required></div>
          <div class="field wide"><label for="cust-gov">المحافظة</label><select id="cust-gov" required></select></div>
          <div class="field wide"><label for="cust-address">العنوان بالتفصيل</label><input id="cust-address" autocomplete="street-address" required></div>
          <div class="field wide"><label for="cust-notes">ملاحظات (اختياري)</label><textarea id="cust-notes"></textarea></div>
        </div>
      </form>

      <div class="actions">
        <button class="btn go" id="send" type="button">تأكيد الأوردر</button>
      </div>
      <p class="msg" id="msg" role="status"></p>
      <p class="fine" id="fine"></p>
      <button class="linkbtn" id="forget" type="button" hidden>امسح بياناتي المحفوظة من الجهاز ده</button>
      <div class="done" id="done" hidden>
        <h3 id="done-title"></h3>
        <p id="done-text"></p>
      </div>
    </div>
  </section>

  <section class="order" id="follow" aria-labelledby="follow-title">
    <h2 class="alt" id="follow-title">تتبع أوردرك</h2>
    <div class="order-body">
      <form id="follow-form" novalidate>
        <div class="fields">
          <div class="field"><label for="follow-no">رقم الأوردر</label><input id="follow-no" dir="ltr" placeholder="R1001" autocomplete="off"></div>
          <div class="field"><label for="follow-phone">رقم الموبايل اللي طلبت بيه</label><input id="follow-phone" inputmode="tel" dir="ltr" autocomplete="tel"></div>
        </div>
        <div class="actions"><button class="btn" id="follow-go" type="submit">اعرف حالة الأوردر</button></div>
      </form>
      <p class="msg" id="follow-msg" role="status"></p>
      <div class="done" id="follow-result" hidden>
        <h3 id="follow-title2"></h3>
        <p id="follow-text"></p>
      </div>
    </div>
  </section>

  <dialog id="confirm" aria-labelledby="confirm-title">
    <h3 id="confirm-title">تأكيد الأوردر</h3>
    <p id="confirm-text">سيتم تسجيل الأوردر وهنتواصل معاك للتأكيد</p>
    <div class="actions">
      <button class="btn go" id="yes-send" type="button">موافق</button>
      <button class="btn" id="no" type="button">لا</button>
    </div>
  </dialog>
</main>

<button class="bar" id="bar" type="button" hidden>
  <span id="bar-count"></span><b id="bar-total"></b>
</button>

<script>
/* ============ الإعدادات: غيّر القيم دي بس ============ */
const CONFIG = {
  storeName: 'Rawy',
  storeNameAr: 'راوي',
  tagline: 'كل قطعة ليها حكاية',
  ordersUrl: 'https://script.google.com/macros/s/AKfycbyy_VsWq4jsP5BuYjWqWPYZugTD4qwv10sEqh-1JljaA8_EJdIWCC1a-8GwmhfnaDyHKg/exec',     // رابط سكريبت Google Sheet: بيجيب المنتجات وبيسجل الأوردرات. فاضي = وضع العرض التجريبي
  currency: 'ج.م',
  lowStockAt: 3      // من أول الكمية دي يظهر "آخر قطع"
};

/* منتجات تجريبية تظهر لحد ما الشيت يتربط */
const SAMPLES = [
  { id: 's1', name: 'تيشرت قطن سادة أبيض', price: 250, qty: 0, stock: { S: 3, M: 5, L: 4, XL: 0 }, category: 'تيشرتات', color: '#F4F4F0', views: 3 },
  { id: 's2', name: 'تيشرت أوفر سايز أسود', price: 320, qty: 0, stock: { M: 2, L: 4, XL: 1 }, category: 'تيشرتات', color: '#22262B', views: 3 },
  { id: 's3', name: 'تيشرت بولو كحلي', price: 380, qty: 0, stock: { M: 2, L: 0 }, category: 'تيشرتات', color: '#24356B' },
  { id: 's4', name: 'تيشرت مخطط زيتي', price: 290, qty: 0, stock: { S: 0, M: 0, L: 0 }, category: 'تيشرتات', color: '#6B7A45' },
  { id: 's5', name: 'هودي قطن رمادي', price: 550, qty: 0, stock: { M: 1, L: 2, XL: 2, XXL: 0 }, category: 'هوديز', color: '#9AA1A6', views: 2 },
  { id: 's6', name: 'شنطة قماش بيج', price: 150, qty: 6, stock: {}, category: 'إكسسوارات', color: '#D8C8A8' }
];

const HEADERS = {
  id: ['id', 'code', 'الكود'],
  name: ['name', 'الاسم', 'اسم المنتج'],
  price: ['price', 'السعر'],
  qty: ['qty', 'quantity', 'stock', 'الكمية', 'الكمية المتوفرة'],
  category: ['category', 'القسم', 'الفئة']
};
/* أسعار الشحن الافتراضية. بعد الربط بتتقري من تبويب "الشحن" في الشيت */
const DEFAULT_SHIPPING = ['القاهرة', 'الجيزة', 'الإسكندرية', 'القليوبية', 'الدقهلية', 'الشرقية', 'الغربية', 'المنوفية', 'البحيرة',
  'كفر الشيخ', 'دمياط', 'بورسعيد', 'الإسماعيلية', 'السويس', 'الفيوم', 'بني سويف', 'المنيا', 'أسيوط', 'سوهاج', 'قنا',
  'الأقصر', 'أسوان', 'البحر الأحمر', 'الوادي الجديد', 'مطروح', 'شمال سيناء', 'جنوب سيناء']
  .map(g => [g, g === 'القاهرة' || g === 'الجيزة' ? 80 : 120]);
const TILES = ['#D6E0F0', '#EAE3D4', '#C6D4EA', '#F0EADF', '#DDE4EF'];
const FALLBACK_COLORS = ['#C9D3E8', '#E3C9B8', '#BFD6C6', '#D9CBE3', '#E6DCB4', '#B9CBD3'];

/* ============ دوال مستقلة (بتتفحص لوحدها) ============ */
function toLatinDigits(s) {
  return String(s).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
}
function toNumber(v) {
  const n = parseFloat(toLatinDigits(v == null ? '' : v).replace(/[^\d.\-]/g, ''));
  return Number.isFinite(n) ? n : 0;
}
const IMAGE_HEADER = /^(images?|img|photos?|رابط الصور|الصور|صور)/i;
function splitUrls(v) {
  return String(v == null ? '' : v).split(/[\s،]+|,\s*(?=https?:)/).map(s => s.trim()).filter(Boolean);
}
function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  const t = String(text).replace(/^﻿/, '');
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) {
      if (c === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && t[i + 1] === '\n') i++;
      row.push(cell); cell = ''; rows.push(row); row = [];
    } else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}
function rowsToProducts(rows) {
  if (!rows.length) return [];
  const raw = rows[0].map(h => String(h).trim());
  const head = raw.map(h => h.toLowerCase());
  const col = {};
  for (const key in HEADERS) col[key] = head.findIndex(h => HEADERS[key].includes(h));
  if (col.name < 0 || col.price < 0) throw new Error('الشيت لازم يكون فيه عمود للاسم وعمود للسعر');
  const known = new Set(Object.values(col).filter(i => i >= 0));
  // أي عمود عنوانه بيبدأ بـ "صورة" أو image بيتحسب صورة للمنتج: صورة 1، صورة 2، ...
  const imgCols = raw.map((h, i) => ({ h, i })).filter(c => IMAGE_HEADER.test(c.h));
  imgCols.forEach(c => known.add(c.i));
  // أي عمود تاني عنوانه مش معروف بيتحسب مقاس، والرقم اللي تحته هو كمية المقاس ده
  const sizeCols = raw.map((h, i) => ({ h, i })).filter(c => c.h && !known.has(c.i) && !/^(notes?|ملاحظ)/i.test(c.h));
  const get = (r, k) => (col[k] >= 0 && r[col[k]] != null ? String(r[col[k]]).trim() : '');
  const out = [];
  rows.slice(1).forEach((r, i) => {
    const name = get(r, 'name');
    if (!name) return;
    const stock = {};
    sizeCols.forEach(c => {
      const v = toLatinDigits(r[c.i] == null ? '' : r[c.i]).trim();
      if (/^\d+$/.test(v)) stock[c.h] = parseInt(v, 10);
    });
    out.push({
      id: get(r, 'id') || 'row' + (i + 2),
      name,
      price: toNumber(get(r, 'price')),
      images: imgCols.flatMap(c => splitUrls(r[c.i])),
      qty: col.qty >= 0 ? Math.max(0, Math.floor(toNumber(get(r, 'qty')))) : 0,
      stock,
      category: get(r, 'category')
    });
  });
  return out;
}
function toCsvUrl(url) {
  const u = String(url).trim();
  const m = u.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]{20,})/);
  if (m && !/\/d\/e\//.test(u) && !/output=csv|out:csv|format=csv/.test(u)) {
    const gid = (u.match(/[#&?]gid=(\d+)/) || [])[1];
    return 'https://docs.google.com/spreadsheets/d/' + m[1] + '/gviz/tq?tqx=out:csv' + (gid ? '&gid=' + gid : '');
  }
  return u;
}
function money(n) { return Number(n).toLocaleString('en-US') + ' ' + CONFIG.currency; }
function sizesOf(p) { return Object.keys(p.stock || {}); }
function stockOf(p, size) { return sizesOf(p).length ? (p.stock[size] || 0) : p.qty; }
function totalStock(p) { const s = sizesOf(p); return s.length ? s.reduce((a, k) => a + p.stock[k], 0) : p.qty; }
function available(cart, p, size) {
  const l = cart.find(x => x.pid === p.id && x.size === (size || ''));
  return Math.max(0, stockOf(p, size) - (l ? l.n : 0));
}
function clampCart(cart, products) {
  const out = [];
  for (const l of cart) {
    const p = products.find(x => x.id === l.pid);
    if (!p) continue;
    const hasSizes = sizesOf(p).length > 0;
    if (hasSizes ? !Object.prototype.hasOwnProperty.call(p.stock, l.size) : !!l.size) continue;
    const n = Math.min(l.n, stockOf(p, l.size));
    if (n > 0) out.push({ pid: l.pid, size: l.size, n });
  }
  return out;
}
function cartTotal(cart, products) {
  return cart.reduce((a, l) => { const p = products.find(x => x.id === l.pid); return a + (p ? p.price * l.n : 0); }, 0);
}
function shippingFee(table, gov) {
  const row = table.find(r => r[0] === gov);
  return row ? Number(row[1]) || 0 : null;
}
function grandTotal(cart, products, fee) { return cartTotal(cart, products) + (Number(fee) || 0); }
function buildPayload(cart, products, c) {
  return {
    customer: { name: c.name, phone: c.phone, gov: c.gov, address: c.address, notes: c.notes },
    items: cart.map(l => { const p = products.find(x => x.id === l.pid); return { id: p.id, name: p.name, size: l.size, n: l.n }; })
  };
}

      say('');
      $('follow-title2').textContent = 'الأوردر ' + out.orderNo + ': ' + out.status;
      $('follow-text').textContent = 'تاريخ الطلب: ' + out.date + '\n' + out.items + '\nالمطلوب عند الاستلام: ' + money(out.due);
      $('follow-result').hidden = false;
    } catch (err) { say('ماقدرناش نوصل لسجل الأوردرات. اتأكد من النت وجرّب تاني.'); }
    finally { btn.disabled = false; }
  });
  const bg = $('bg');
  if (bg && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) {
    let queued = false;
    window.addEventListener('scroll', () => {
      if (queued) return; queued = true;
      requestAnimationFrame(() => { bg.style.backgroundPosition = '0 ' + (-window.scrollY * 0.3).toFixed(1) + 'px, 0 0'; queued = false; });
    }, { passive: true });
  }
  $('bar').addEventListener('click', () => $('order').scrollIntoView({ block: 'start' }));

  async function init() {
    $('brand').textContent = CONFIG.storeName;
    $('brand-ar').textContent = CONFIG.storeNameAr || '';
    $('tagline').textContent = CONFIG.tagline;
    $('fine').textContent = 'بعد التأكيد هنتواصل معاك على رقم موبايلك عشان نأكد الأوردر وميعاد التوصيل.';
    fillGovs(); load(); recallCustomer();
    try { const last = localStorage.getItem('rawy-last-order'); if (last) $('follow-no').value = last; } catch (e) {}
    setTimeout(hideLoader, 15000);   // أمان: لو حاجة اتعطلت، الصفحة تفتح برضه
    await loadProducts();
    renderFilters(); renderAll();
    await warmImages(8, 6000);
    hideLoader();
  }
  function hideLoader() {
    const l = $('loader'); if (!l || l.classList.contains('gone')) return;
    l.classList.add('gone'); setTimeout(() => l.remove(), 600);
  }
  // بيحمّل أول صورة لأول منتجات قبل ما نكشف الصفحة، بحد أقصى للوقت
  function warmImages(count, maxMs) {
    const urls = products.slice(0, count).map(p => { const l = slidesOf(p); return l[0] && l[0].url; }).filter(Boolean);
    if (!urls.length) return Promise.resolve();
    const all = Promise.all(urls.map(u => new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = u; })));
    return Promise.race([all, new Promise(r => setTimeout(r, maxMs))]);
  }
  async function loadProducts() {
    const notice = $('notice');
    if (!CONFIG.ordersUrl && !CONFIG.sheetUrl) {
      notice.textContent = 'دي منتجات تجريبية للعرض. بعد ربط Google Sheet هتظهر منتجاتك وأسعارك وكمياتك.';
      notice.hidden = false; return;
    }
    try {
      let rows;
      if (CONFIG.ordersUrl) {
        const out = await (await fetch(CONFIG.ordersUrl, { cache: 'no-store' })).json();
        if (!out.ok || !Array.isArray(out.rows)) throw new Error(out.message || 'رد غير متوقع من السكريبت');
        rows = out.rows.filter(r => r.some(x => String(x).trim() !== ''));
        if (Array.isArray(out.shipping) && out.shipping.length) {
          shipping = out.shipping.map(r => [String(r[0]).trim(), toNumber(r[1])]).filter(r => r[0]);
          fillGovs();
        }
      } else {
        const res = await fetch(toCsvUrl(CONFIG.sheetUrl), { cache: 'no-store' });
        if (!res.ok) throw new Error('الشيت رد بكود ' + res.status);
        rows = parseCSV(await res.text());
      }
      const list = rowsToProducts(rows);
      if (!list.length) throw new Error('الشيت مفيهوش منتجات');
      products = list; notice.hidden = true;
    } catch (err) {
      notice.textContent = 'ماقدرناش نقرا المنتجات من الشيت (' + err.message + '). المعروض دلوقتي منتجات تجريبية.';
      notice.hidden = false;
    }
  }
  init();
})();

if (typeof module !== 'undefined') module.exports = { parseCSV, rowsToProducts, toCsvUrl, available, totalStock, stockOf, clampCart, cartTotal, grandTotal, shippingFee, buildPayload, splitUrls, DEFAULT_SHIPPING, toNumber, CONFIG };
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
</body>
